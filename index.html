<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="naver-site-verification" content="ab5cd831be39fa3021dfa3a9105a435fc059d4c1" />
<title>돌멩이 키우기</title>
<style>
:root{--bg:#11152a;--panel:#202743;--line:#414d70;--text:#f6f7ff;--muted:#aeb8d8;--mint:#79f2c2;--gold:#ffd36e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,"Malgun Gothic",sans-serif;background:radial-gradient(ellipse at 50% -10%,#394a78,#1b2340 36%,#101426 75%)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.42;cursor:not-allowed}
.wrap{max-width:1000px;margin:auto;padding:16px 14px 32px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.logo{font-size:clamp(25px,5vw,37px);font-weight:1000;letter-spacing:-1.5px}
.logo span{color:var(--mint)}
.tiny,.small{color:var(--muted);font-size:12px}
.pill{border:1px solid var(--line);background:#171d32;border-radius:999px;padding:8px 12px;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat,.panel{background:linear-gradient(145deg,#252e4c,#1a2037);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:0 8px 25px #0002}
.stat .label{font-size:12px;color:var(--muted)}
.stat .value{font-size:clamp(17px,3.7vw,25px);font-weight:950;margin-top:4px;overflow-wrap:anywhere}
.mint{color:var(--mint)}.gold{color:var(--gold)}
.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:12px;margin-bottom:12px}
.petbox{position:relative;min-height:330px;padding-top:50px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 76%,#547bb0,#293b65 40%,#171d34 78%);border:1px solid #52658e;border-radius:23px;isolation:isolate}
.stars{position:absolute;inset:0;background-image:radial-gradient(#fff9 1px,transparent 1.5px);background-size:33px 31px;opacity:.32;z-index:-1}
.cloud{position:absolute;width:110px;height:28px;border-radius:30px;background:#b9e6ff;opacity:.15;animation:cloud 9s linear infinite}
.cloud.c1{top:27%;left:-120px}.cloud.c2{top:68%;left:-140px;animation-delay:-4.5s}
@keyframes cloud{to{transform:translateX(650px)}}
.rankTitle{position:absolute;top:13px;left:50%;transform:translateX(-50%);z-index:5;white-space:nowrap;background:#101729e8;border:1px solid #7387b3;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:1000;color:#ffe28a}
.pet{position:relative;width:190px;height:205px;animation:bob 2s ease-in-out infinite;cursor:pointer;filter:drop-shadow(0 12px 0 #11162b66);z-index:2}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.money{position:absolute;font-size:23px;animation:float 2s ease-in-out infinite;z-index:1}
.m1{top:25%;left:13%}.m2{top:42%;right:10%;animation-delay:-1s}.m3{bottom:18%;left:18%;animation-delay:-.5s}
